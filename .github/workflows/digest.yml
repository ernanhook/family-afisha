name: Family events digest

on:
  schedule:
    - cron: "17 * * * *"   # проверка раз в час; сводку скрипт шлёт в день и час из settings.txt
  workflow_dispatch:        # ручной запуск — сразу присылает сводку

permissions:
  contents: write
  actions: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENWEBNINJA_API_KEY: ${{ secrets.OPENWEBNINJA_API_KEY }}
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Save state
        if: always()
        run: |
          [ -f state.json ] || exit 0
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add state.json
          if [ -d calendar ]; then git add calendar; fi   # календари для iPhone
          git diff --cached --quiet || git commit -m "update state"
          git pull --rebase -X theirs || true   # если вы правили файлы во время запуска
          git push
      # не даёт GitHub отключить расписание после 60 дней без активности:
      # официальный вызов API GitHub, без сторонних расширений
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/digest.yml/enable" || true
